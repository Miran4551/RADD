<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6255f5">
<title>رَدّ | لا تجعل فرصة التواصل تختفي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--bg:#f4f6fa;--surface:#fff;--ink:#20243a;--muted:#73788d;--line:#e5e8f0;--p:#6355f5;--p2:#8d82ff;--soft:#efedff;--good:#158463;--goodBg:#eaf9f3;--warn:#c98522;--warnBg:#fff6e6;--danger:#cf625a;--shadow:0 16px 50px rgba(43,32,108,.08)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Cairo,system-ui,sans-serif;background:linear-gradient(180deg,#f8f9fc,#f3f5f9);color:var(--ink)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #8d82ff66;outline-offset:3px}
.header{height:74px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 8px 24px #6355f533}.brand-name{font-weight:800;font-size:20px}.brand-sub{font-size:9px;color:#979aa8}
.tabs{display:flex;background:#eff0f6;padding:4px;border-radius:13px;gap:4px}.tab{border:0;background:transparent;color:#777b8d;border-radius:10px;padding:8px 15px;font-size:11px}.tab.active{background:#fff;color:var(--p);box-shadow:0 2px 10px #2221}
.container{max-width:1160px;margin:auto;padding:30px 20px 80px}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.eyebrow{color:var(--p);font-size:11px;font-weight:800}.title{margin:4px 0 0;font-size:29px}.sub{margin:4px 0 0;color:var(--muted);font-size:11px}.reset{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:#666b7d;font-size:10px}
.story{margin-top:20px;background:linear-gradient(110deg,#6255f5,#7b6fff);border-radius:24px;padding:24px;color:#fff;display:grid;grid-template-columns:1.55fr .75fr;gap:20px;box-shadow:0 18px 50px #6355f528}
.story h2{font-size:30px;line-height:1.45;margin:7px 0}.story p{margin:0;color:#eeeefe;font-size:12px;line-height:2;max-width:710px}.story .quote{margin-top:15px;background:#ffffff18;border:1px solid #ffffff24;border-radius:15px;padding:11px 13px;font-size:12px}
.story-side{background:#ffffff16;border:1px solid #ffffff25;border-radius:20px;padding:17px;display:flex;flex-direction:column;justify-content:center}.story-side .mini{display:flex;gap:10px;align-items:center}.story-side .mini-icon{width:42px;height:42px;border-radius:14px;background:#ffffff20;display:grid;place-items:center;font-size:20px}.story-side b{font-size:13px}.story-side small{display:block;font-size:9px;color:#e6e3ff;margin-top:2px}
.path{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}.path-title{font-size:11px;font-weight:800;margin-bottom:10px}.path-row{display:flex;align-items:center;gap:7px;overflow:auto}.path-step{white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:9px;color:#6d7185}.path-n{width:23px;height:23px;border-radius:8px;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800}.path-arr{min-width:18px;height:1px;background:#dfe1ea}
.focus{margin-top:18px;background:#fff;border:2px solid #dcd8ff;border-radius:23px;padding:20px;box-shadow:0 18px 50px #5146bd10;position:relative;overflow:hidden}
.focus::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--p),#a89fff)}
.focus-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.focus-head h3{margin:0;font-size:16px}.priority{background:var(--warnBg);color:var(--warn);border-radius:20px;padding:5px 9px;font-size:9px;font-weight:700}
.focus-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;margin-top:15px}.person{background:#f8f8fc;border-radius:18px;padding:18px;display:flex;gap:13px;align-items:center}.avatar{width:55px;height:55px;border-radius:17px;background:linear-gradient(145deg,#efedff,#e5e1ff);display:grid;place-items:center;font-size:23px}.person b{font-size:15px}.person small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.request{background:var(--soft);border-radius:18px;padding:18px}.request-label{font-size:9px;color:var(--p);font-weight:800}.request p{font-size:18px;font-weight:700;margin:6px 0 0;line-height:1.6}.request small{display:block;color:#777b8d;font-size:9px;margin-top:6px}
.focus-actions{display:flex;gap:8px;margin-top:15px}.primary{flex:1;border:0;background:var(--p);color:#fff;border-radius:13px;padding:12px;font-size:12px;font-weight:800}.secondary{border:0;background:#f1f2f6;color:#666a7b;border-radius:13px;padding:12px 17px;font-size:11px}
.why{margin-top:12px;background:#fff9ef;border:1px solid #f5e6c5;color:#77521b;border-radius:14px;padding:10px 12px;font-size:10px;line-height:1.8}.why b{font-size:10px}
.section{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}.section h3{margin:0;font-size:17px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:10px}.queue{display:grid;gap:8px}.queue-item{width:100%;border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;display:flex;align-items:center;gap:11px;text-align:right;transition:.15s}.queue-item:hover{border-color:#d4cffc;transform:translateY(-1px)}.qicon{width:43px;height:43px;border-radius:14px;background:#f1efff;display:grid;place-items:center;font-size:19px}.qbody{flex:1}.qbody b{font-size:12px}.qbody p{margin:2px 0;color:#575b6f;font-size:10px}.qmeta{font-size:8px;color:#999cab}.qstatus{font-size:8px;padding:4px 7px;border-radius:20px}.qstatus.ready{background:var(--warnBg);color:var(--warn)}.qstatus.defer{background:var(--soft);color:var(--p)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.metric strong{display:block;font-size:24px}.metric span{font-size:9px;color:var(--muted)}
.privacy{margin-top:12px;background:var(--goodBg);border:1px solid #d5eee4;color:#17694e;border-radius:15px;padding:11px 13px;font-size:9px;line-height:1.8}
.child-shell{max-width:830px;margin:0 auto}.child-card{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow)}.child-intro{display:flex;align-items:center;gap:14px}.child-intro h2{margin:2px 0 0;font-size:26px}.child-intro p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.8}
.scenario{margin-top:21px;background:#faf9ff;border:1px solid #e3dfff;border-radius:20px;padding:18px}.scenario-title{font-size:10px;font-weight:800;color:#6d7190}.bubble{margin-top:10px;background:#fff;border-radius:17px;padding:14px;font-size:16px;font-weight:800;box-shadow:0 8px 22px #5b50b40b;position:relative}.bubble::after{content:"";position:absolute;right:20px;bottom:-7px;width:14px;height:14px;background:#fff;transform:rotate(45deg)}.bubble small{display:block;color:var(--muted);font-size:9px;margin-top:5px;font-weight:400}
.save-action{width:100%;margin-top:16px;border:0;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;border-radius:15px;padding:14px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.handoff{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:18px}.handoff-box{background:#f7f7fa;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center}.handoff-box b{display:block;font-size:10px}.handoff-box small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.handoff-arrow{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--p);display:grid;place-items:center;font-weight:800}
.child-history{margin-top:17px}.history-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:15px;padding:11px;margin-top:7px;background:#fff}.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:0 0 10px}.done .dot{background:var(--good)}.history-row b{font-size:10px}.history-row small{display:block;color:var(--muted);font-size:8px;margin-top:2px}
.overlay{position:fixed;inset:0;background:#1a17386f;backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;z-index:60}.modal{width:min(510px,100%);background:#fff;border-radius:24px;padding:26px;position:relative;box-shadow:0 30px 100px #17132d44}.close{position:absolute;left:13px;top:13px;width:31px;height:31px;border:0;border-radius:9px;background:#f3f3f6;color:#777}.modal-icon{width:56px;height:56px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:25px}.modal h2{font-size:20px;margin:11px 0 4px}.modal p{font-size:11px;color:var(--muted);line-height:1.9}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.choice-grid button{background:#f8f8fb;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:right}.choice-grid button:hover{background:var(--soft);border-color:#d1cbff}.choice-grid span{font-size:20px}.choice-grid b{display:block;font-size:10px;margin-top:4px}.confirm{background:#f7f7fa;border-radius:15px;padding:13px;margin:13px 0;font-size:11px}.confirm small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20243a;color:#fff;border-radius:12px;padding:10px 14px;font-size:10px;z-index:100;box-shadow:0 10px 35px #12122344}.hidden{display:none!important}
@media(max-width:850px){.story,.focus-grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.handoff{grid-template-columns:1fr}.handoff-arrow{margin:auto;transform:rotate(90deg)}}
@media(max-width:560px){.header{padding:0 12px}.brand-sub{display:none}.tab{padding:7px 9px}.container{padding:24px 12px 60px}.story h2{font-size:27px}.title{font-size:25px}.focus-grid{gap:10px}.focus-actions{flex-direction:column}.secondary{width:100%}.choice-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><div class="brand-mark">♥</div><div><div class="brand-name">رَدّ</div><div class="brand-sub">نظام لاستعادة فرص التواصل الأسري</div></div></div>
  <div class="tabs"><button class="tab active" id="parentTab">الوالد</button><button class="tab" id="childTab">الطفل</button></div>
</header>
<main id="app"></main>
<div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
(function(){
  var TYPES={
    SHOW:{label:"أريد أن أريك شيئًا",icon:"👀",priority:72,reason:"مشاركة تحتاج حضورًا وانتباهًا"},
    TALK:{label:"أريد أن أتحدث معك",icon:"💬",priority:90,reason:"محاولة حوار مباشرة"},
    HELP:{label:"أحتاج مساعدتك",icon:"🤝",priority:98,reason:"طلب مساعدة — أعلى أولوية"},
    SHARE:{label:"أريد أن أشاركك شيئًا",icon:"✨",priority:70,reason:"مشاركة يمكن العودة إليها"}
  };
  var seed=[
    {id:"s1",from:"سارة",type:"HELP",status:"READY",created:Date.now()-4*60000,priority:98},
    {id:"s2",from:"محمد",type:"SHOW",status:"DEFERRED",created:Date.now()-9*60000,priority:72},
    {id:"s3",from:"محمد",type:"TALK",status:"RECOVERED",created:Date.now()-55*60000,recovered:Date.now()-35*60000,priority:90}
  ];
  var moments;
  try{moments=JSON.parse(localStorage.getItem("radd-demo-v4"))||seed.map(function(x){return Object.assign({},x);});}catch(e){moments=seed.map(function(x){return Object.assign({},x);});}
  var role="parent";
  var app=document.getElementById("app"),overlay=document.getElementById("overlay"),toastEl=document.getElementById("toast");
  function persist(){try{localStorage.setItem("radd-demo-v4",JSON.stringify(moments));}catch(e){}}
  function ago(t){var m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"الآن":"منذ "+m+" دقيقة";}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function setTabs(){document.getElementById("parentTab").className="tab "+(role==="parent"?"active":"");document.getElementById("childTab").className="tab "+(role==="child"?"active":"");}
  function toast(msg){toastEl.textContent=msg;toastEl.classList.remove("hidden");setTimeout(function(){toastEl.classList.add("hidden")},2200);}
  function render(){setTabs();role==="parent"?renderParent():renderChild();}
  function path(){return '<div class="path"><div class="path-title">رحلة رَدّ</div><div class="path-row"><div class="path-step"><span class="path-n">١</span>محاولة تواصل</div><div class="path-arr"></div><div class="path-step"><span class="path-n">٢</span>تعذر الرد</div><div class="path-arr"></div><div class="path-step"><span class="path-n">٣</span>حفظ الفرصة</div><div class="path-arr"></div><div class="path-step"><span class="path-n">٤</span>العودة</div><div class="path-arr"></div><div class="path-step"><span class="path-n">٥</span>استعادة التفاعل</div></div></div>';}
  function renderParent(){
    var active=moments.filter(function(m){return m.status!=="RECOVERED";}).sort(function(a,b){return b.priority-a.priority;});
    var rec=moments.filter(function(m){return m.status==="RECOVERED";});
    var focus=active[0];
    var firr=moments.length?Math.round(rec.length/moments.length*100):0;
    var lat=rec.length?Math.max(0,Math.round(rec.reduce(function(s,m){return s+(m.recovered-m.created)/60000;},0)/rec.length)):0;
    var focusHtml=focus?'<section class="focus"><div class="focus-head"><div><h3>ابدأ بهذه الفرصة الآن</h3><div style="font-size:9px;color:var(--muted);margin-top:3px">هذه أعلى فرصة أولوية لدى الأسرة</div></div><span class="priority">أولوية '+focus.priority+'</span></div>'+
      '<div class="focus-grid"><div class="person"><div class="avatar">'+(focus.from==="سارة"?"👧":"👦")+'</div><div><b>'+esc(focus.from)+'</b><small>ينتظر العودة منك '+ago(focus.created)+'</small></div></div>'+
      '<div class="request"><div class="request-label">ما الذي يحتاجه؟</div><p>'+TYPES[focus.type].icon+' '+TYPES[focus.type].label+'</p><small>لماذا الآن؟ '+TYPES[focus.type].reason+'</small></div></div>'+
      '<div class="focus-actions"><button class="primary" id="focusRecover">♥ أعد التفاعل الآن</button><button class="secondary" id="focusLater">أعدها لاحقًا</button></div>'+
      '<div class="why"><b>المغزى:</b> لا يطلب منك رَدّ تغيير يومك؛ فقط يساعدك ألا تنسى الشخص الذي طلب تواصلك.</div></section>':
      '<section class="focus"><div class="focus-head"><div><h3>لا توجد فرصة معلّقة</h3><div style="font-size:9px;color:var(--muted);margin-top:3px">يمكنك إنشاء تجربة جديدة من وضع الطفل.</div></div></div></section>';
    app.innerHTML='<div class="container"><div class="topline"><div><div class="eyebrow">التجربة الحية</div><div class="title">لوحة الوالد</div><div class="sub">هنا لا ترى «تنبيهات» فقط؛ ترى تفاعلًا ينتظر عودتك.</div></div><button class="reset" id="resetBtn">↻ إعادة التجربة</button></div>'+
      '<section class="story"><div><div class="eyebrow" style="color:#efeaff">جوهر رَدّ</div><h2>لا نمنع كل مقاطعة.<br>نمنع <span style="color:#d7d2ff">ضياع التفاعل المهم.</span></h2><p>عندما لا تستطيع أن تكون حاضرًا الآن، يحفظ رَدّ فرصة التواصل ويعيدها لك عندما يصبح لديك وقت للعودة.</p><div class="quote">مثال: <b>«بابا.. شوف!»</b> ← «بعد شوي يا حبيبي» ← <b>رَدّ يحفظ فرصة العودة.</b></div></div>'+
      '<div class="story-side"><div class="mini"><div class="mini-icon">⏱</div><div><b>لا تحتاج وقتًا إضافيًا</b><small>تحتاج فقط أن تتذكر العودة.</small></div></div><div style="height:1px;background:#fff2;margin:14px 0"></div><div class="mini"><div class="mini-icon">♥</div><div><b>نقيس ما عاد فعلًا</b><small>لا نقيس وقت الشاشة ولا نحاسب الأسرة.</small></div></div></div></section>'+
      path()+focusHtml+
      '<section class="section"><div class="section-head"><div><h3>باقي فرص التواصل</h3><p>المعلّقة محفوظة، وتبقى حتى تحصل على فرصة للعودة.</p></div></div><div class="queue">'+(active.slice(1).map(queueItem).join("")||(active.length?'<div class="privacy">كل الفرص الحالية عُرضت في «ابدأ بهذه الفرصة الآن».</div>':'<div class="empty">لا توجد فرص تواصل أخرى.</div>'))+'</div></section>'+
      '<section class="metrics"><div class="metric"><strong>'+firr+'%</strong><span>معدل استعادة التفاعل</span></div><div class="metric"><strong>'+lat+' د</strong><span>متوسط زمن العودة</span></div><div class="metric"><strong>'+rec.length+'</strong><span>تفاعلات تمت استعادتها</span></div></section>'+
      '<div class="privacy">🛡️ <b>خصوصية أولًا:</b>&nbsp; رَدّ لا يحتاج ميكروفونًا دائمًا، ولا كاميرا، ولا مراقبة للشاشة، ولا قراءة للمحادثات الخاصة.</div></div>';
    if(focus){document.getElementById("focusRecover").onclick=function(){recover(focus.id);};document.getElementById("focusLater").onclick=function(){toast("تم إبقاء فرصة التواصل للعودة لاحقًا");};}
    document.getElementById("resetBtn").onclick=reset;
    Array.prototype.forEach.call(document.querySelectorAll(".queue-item"),function(b){b.onclick=function(){openMoment(b.getAttribute("data-id"));};});
  }
  function queueItem(m){var t=TYPES[m.type];return '<button class="queue-item" data-id="'+esc(m.id)+'"><div class="qicon">'+t.icon+'</div><div class="qbody"><b>'+esc(m.from)+'</b><p>'+t.label+'</p><span class="qmeta">'+ago(m.created)+'</span></div><span class="qstatus '+(m.status==="READY"?"ready":"defer")+'">'+(m.status==="READY"?"جاهزة للعودة":"مؤجلة")+'</span><span class="chev">‹</span></button>'; }
  function renderChild(){
    var mine=moments.filter(function(m){return m.from==="محمد";}).sort(function(a,b){return b.created-a.created;});
    var pending=mine.filter(function(m){return m.status!=="RECOVERED";}).length;
    app.innerHTML='<div class="container"><div class="child-shell"><div class="topline"><div><div class="eyebrow">التجربة الحية</div><div class="title">تجربة الطفل</div><div class="sub">ابدأ من هنا، ثم شاهد ماذا يحدث لفرصة التواصل.</div></div></div>'+path()+
      '<div class="child-card"><div class="child-intro"><div class="avatar">م</div><div><div class="eyebrow">محمد</div><h2>عندي شيء أبي أقوله</h2><p>إذا كان بابا أو ماما مشغولين، ما أبي أنسى وأنا أنتظر.</p></div></div>'+
      '<div class="scenario"><div class="scenario-title">الموقف</div><div class="bubble">«بابا.. شوف رسمتي!»<small>الأب مشغول الآن ولا يستطيع الرد.</small></div><button class="save-action" id="saveChance"><span>احفظ فرصة التواصل</span><span>←</span></button></div>'+
      '<div class="handoff"><div class="handoff-box"><b>الطفل</b><small>يحفظ فرصة التواصل</small></div><div class="handoff-arrow">←</div><div class="handoff-box"><b>الوالد</b><small>يراها عند عودته</small></div></div>'+
      '<div class="child-history"><div class="section-head"><div><h3>ما الذي حدث لفرصي؟</h3><p>'+pending+' فرصة ما زالت تنتظر العودة.</p></div></div>'+
      (mine.length?mine.map(historyRow).join(""):'<div class="empty">لم تحفظ أي فرصة بعد.</div>')+
      '</div><div class="privacy">🛡️ أنت تختار بنفسك ماذا تحفظ. لا نحتاج تسجيل صوتك أو تصويرك.</div></div></div></div>';
    document.getElementById("saveChance").onclick=capture;
  }
  function historyRow(m){var t=TYPES[m.type],done=m.status==="RECOVERED";return '<div class="history-row '+(done?"done":"")+'"><div class="dot"></div><div><b>'+t.icon+' '+t.label+'</b><small>'+(done?"✓ تم استعادة التفاعل":"بانتظار عودة الوالد")+' • '+ago(m.created)+'</small></div></div>'; }
  function capture(){
    overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeChoices">×</button><div class="modal-icon">♥</div><div class="eyebrow" style="margin-top:12px">حفظ فرصة تواصل</div><h2>ماذا تريد أن تقول؟</h2><p>اختر نوع التفاعل فقط. رَدّ لا يسجل صوتك أو صورتك.</p><div class="choice-grid">'+Object.keys(TYPES).map(function(k){var t=TYPES[k];return '<button data-choice="'+k+'"><span>'+t.icon+'</span><b>'+t.label+'</b></button>';}).join("")+'</div></div></div>';
    document.getElementById("closeChoices").onclick=closeModal;
    Array.prototype.forEach.call(document.querySelectorAll("[data-choice]"),function(b){b.onclick=function(){confirmChoice(b.getAttribute("data-choice"));};});
  }
  function confirmChoice(type){
    var t=TYPES[type];
    overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeConfirm">×</button><div class="eyebrow">تأكيد</div><h2>هذه فرصة تواصل مهمة</h2><p>سيتم حفظها ليعود إليها الوالد عندما يصبح متاحًا.</p><div class="confirm"><b>'+t.icon+' '+t.label+'</b><small>الأولوية المقترحة: '+t.priority+' — '+t.reason+'</small></div><button class="action-primary" id="saveNow">حفظ وإرسال للوالد</button><button class="action-secondary" id="back">رجوع</button></div></div>';
    document.getElementById("closeConfirm").onclick=closeModal;document.getElementById("back").onclick=capture;document.getElementById("saveNow").onclick=function(){addMoment(type);};
  }
  function addMoment(type){
    var t=TYPES[type];
    moments=moments.map(function(m){return Object.assign({},m,{_justCreated:false});});
    moments.push({id:"m"+Date.now(),from:"محمد",type:type,status:"READY",created:Date.now(),priority:t.priority,_justCreated:true});
    persist();closeModal();toast("❤️ تم حفظ فرصة التواصل لدى الوالد");render();
  }
  function openMoment(id){
    var m=moments.filter(function(x){return x.id===id;})[0];if(!m)return;
    var t=TYPES[m.type];
    overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeMoment">×</button><div class="modal-icon">'+t.icon+'</div><div class="eyebrow" style="margin-top:12px">فرصة تواصل '+(m.status==="READY"?"جاهزة":"مؤجلة")+'</div><h2>'+esc(m.from)+' — '+t.label+'</h2><p>هذه ليست مهمة جديدة. هذه فرصة حوار لم تحصل على رد في وقتها.</p><div class="confirm"><b>لماذا تظهر الآن؟</b><small>'+t.reason+' — أضيفت '+ago(m.created)+'</small></div><button class="action-primary" id="recover">♥ أعد التفاعل الآن</button><button class="action-secondary" id="later">ليس الآن</button></div></div>';
    document.getElementById("closeMoment").onclick=closeModal;document.getElementById("later").onclick=closeModal;document.getElementById("recover").onclick=function(){recover(id);};
  }
  function recover(id){
    var m=moments.filter(function(x){return x.id===id;})[0];if(!m)return;
    var now=Date.now();
    moments=moments.map(function(x){return x.id===id?Object.assign({},x,{status:"RECOVERED",recovered:now,_justCreated:false}):x;});
    persist();
    overlay.innerHTML='<div class="overlay"><div class="modal"><div class="modal-icon">♥</div><div class="eyebrow" style="margin-top:12px">استعادة مكتملة</div><h2>رجعت اللحظة ❤️</h2><p>الآن تحولت فرصة التواصل من شيء مؤجل إلى تفاعل تمت استعادته.</p><div class="recovered-modal"><b>'+esc(m.from)+' — '+TYPES[m.type].label+'</b><br>زمن الاستعادة: '+Math.max(0,Math.round((now-m.created)/60000))+' دقيقة<br>الحالة: تمت الاستعادة</div><button class="action-primary" id="done">العودة إلى لوحة الوالد</button></div></div>';
    var st=document.createElement("style");st.textContent=".recovered-modal{background:var(--goodBg);border:1px solid #d5eee4;border-radius:16px;padding:14px;margin:13px 0;color:#17694e;font-size:10px;line-height:1.9}.action-primary{width:100%;border:0;background:var(--p);color:#fff;border-radius:12px;padding:12px;font-size:12px;font-weight:800}.action-secondary{width:100%;margin-top:7px;border:0;background:#f3f3f6;color:#66697a;border-radius:12px;padding:11px;font-size:11px}";
    document.head.appendChild(st);
    document.getElementById("done").onclick=function(){closeModal();role="parent";render();toast("تم تسجيل استعادة التفاعل ❤️");};
  }
  function reset(){localStorage.removeItem("radd-demo-v4");moments=seed.map(function(x){return Object.assign({},x);});persist();role="parent";render();toast("تمت إعادة السيناريو");}
  function closeModal(){overlay.innerHTML="";}
  document.getElementById("parentTab").onclick=function(){role="parent";render();};
  document.getElementById("childTab").onclick=function(){role="child";render();};
  render();
})();
</script>
</body>
</html>
