<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b5cf6">
<title>رَدّ | فرصة ثانية للتواصل</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--bg:#f7f7fb;--ink:#202239;--muted:#777b90;--line:#e6e6ee;--card:#fff;--p:#6b5cf6;--p2:#8b80ff;--soft:#f0eeff;--good:#158463;--goodbg:#ecf9f4;--warn:#c88727;--warnbg:#fff7e8;--danger:#cf5f55;--shadow:0 18px 50px rgba(35,28,92,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 95% 0,#ece8ff,transparent 32%),var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8b80ff55;outline-offset:2px}
.header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#ffffffdc;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:0 8px 25px #6b5cf633}.brand b{font-size:20px}.brand small{display:block;font-size:9px;color:#8e90a0;margin-top:-2px}
.tabs{display:flex;gap:4px;background:#efeff6;padding:4px;border-radius:12px}.tabs button{border:0;background:transparent;color:#74778b;padding:8px 14px;border-radius:9px;font-size:11px}.tabs button.active{background:#fff;color:var(--p);box-shadow:0 2px 10px #28213610}
.wrap{max-width:1120px;margin:auto;padding:42px 20px 90px}.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:center}.eyebrow{font-size:11px;font-weight:800;color:var(--p);margin-bottom:7px}.hero h1{font-size:44px;line-height:1.35;margin:0}.hero h1 span{color:var(--p)}.hero p{font-size:14px;line-height:2;color:var(--muted);margin:12px 0 0;max-width:720px}.hero-card{background:linear-gradient(155deg,#fff,#f1efff);border:1px solid #e0dcff;border-radius:27px;padding:28px;text-align:center;box-shadow:var(--shadow)}.hero-icon{width:72px;height:72px;background:#fff;border-radius:22px;display:grid;place-items:center;color:var(--p);font-size:30px;margin:auto;box-shadow:0 8px 28px #6b5cf61b}.hero-card b{display:block;font-size:17px;margin-top:14px}.hero-card small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.section{margin-top:42px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:13px}.section-head h2{font-size:20px;margin:0}.section-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.btn-ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:#66697d;font-size:10px}
.list{display:grid;gap:10px}.moment{width:100%;display:flex;align-items:center;gap:12px;text-align:right;border:1px solid var(--line);background:#fff;border-radius:18px;padding:15px;box-shadow:0 5px 20px #24203a07;transition:.16s}.moment:hover{transform:translateY(-2px);border-color:#d4cffc}.micon{width:54px;height:54px;border-radius:17px;background:var(--soft);display:grid;place-items:center;font-size:23px;flex:0 0 54px}.mbody{flex:1}.top{display:flex;justify-content:space-between;gap:10px}.top b{font-size:14px}.top small{font-size:9px;color:#a0a1af}.mbody p{font-size:12px;color:#585b6d;margin:4px 0 7px}.chip{font-size:9px;background:#f4f4f8;color:#6e7082;border-radius:20px;padding:4px 8px;margin-left:4px}.status-ready{background:var(--warnbg);color:var(--warn)}.status-deferred{background:#f3f2ff;color:var(--p)}.status-recovered{background:var(--goodbg);color:var(--good)}.chev{font-size:21px;color:#aaa}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.metric strong{display:block;font-size:27px}.metric span{font-size:10px;color:var(--muted)}
.privacy{display:flex;gap:10px;align-items:flex-start;margin-top:16px;background:var(--goodbg);border:1px solid #d5eee4;color:#176a50;border-radius:17px;padding:14px;font-size:11px;line-height:1.8}
.empty{padding:26px;background:#fff;border:1px dashed #d9d8e2;border-radius:18px;text-align:center;color:var(--muted);font-size:12px}
.child{max-width:820px;margin:12px auto}.child-head{display:flex;align-items:center;gap:15px}.avatar{width:66px;height:66px;border-radius:22px;background:linear-gradient(145deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}.child h1{margin:0;font-size:28px}.child .lead{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.8}.save-panel{margin-top:27px;background:#fff;border:1px solid #e0dcff;border-radius:25px;padding:22px;box-shadow:var(--shadow)}.save-panel button{width:100%;border:0;background:linear-gradient(145deg,#6b5cf6,#877dff);color:#fff;border-radius:18px;padding:17px 18px;display:flex;align-items:center;gap:13px;text-align:right}.save-panel .circle{width:49px;height:49px;border-radius:15px;background:#ffffff22;display:grid;place-items:center;font-size:20px}.save-panel b{display:block;font-size:17px}.save-panel small{display:block;color:#eae8ff;font-size:10px;margin-top:3px}.child-list{margin-top:18px}.child-row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;align-items:center;gap:11px;margin-top:8px}.child-row .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:0 0 10px}.child-row.done .dot{background:var(--good)}.child-row b{font-size:12px}.child-row small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.overlay{position:fixed;inset:0;background:#1f1b3f78;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;z-index:60}.modal{width:min(500px,100%);background:#fff;border-radius:24px;padding:26px;position:relative;box-shadow:0 35px 100px #15112740}.close{position:absolute;left:14px;top:14px;width:32px;height:32px;border:0;border-radius:9px;background:#f4f4f7;color:#777}.modal h2{margin:0 0 5px;font-size:20px}.modal p{font-size:11px;line-height:1.9;color:var(--muted)}.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.type-grid button{background:#f8f8fb;border:1px solid var(--line);border-radius:15px;padding:13px;text-align:right}.type-grid button:hover{background:var(--soft);border-color:#cdc8ff}.type-grid span{font-size:20px}.type-grid b{display:block;font-size:11px;margin-top:5px}.confirm{margin-top:16px;background:#f8f8fb;border-radius:16px;padding:15px}.confirm strong{display:block;font-size:14px}.confirm small{color:var(--muted);font-size:10px}.action{width:100%;margin-top:14px;border:0;background:var(--p);color:#fff;border-radius:12px;padding:12px;font-size:12px;font-weight:800}.secondary{width:100%;margin-top:7px;border:0;background:#f3f3f6;color:#66697a;border-radius:12px;padding:11px;font-size:11px}.recovery{background:var(--goodbg);border:1px solid #d5eee4;border-radius:17px;padding:14px;margin-top:14px;color:#176a50;font-size:11px;line-height:1.9}
.timeline{margin-top:18px;display:grid;gap:8px}.event{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);padding:12px;border-radius:14px}.event .eicon{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center}.event b{font-size:11px}.event small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:#202239;color:#fff;border-radius:12px;padding:11px 16px;font-size:11px;z-index:80;box-shadow:0 12px 35px #10102044}.hidden{display:none!important}
@media(max-width:820px){.hero{grid-template-columns:1fr}.hero h1{font-size:35px}.metrics{grid-template-columns:1fr}}@media(max-width:520px){.header{padding:0 12px}.brand small{display:none}.tabs button{padding:7px 9px}.wrap{padding:30px 13px 70px}.type-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><div class="logo">♥</div><div><b>رَدّ</b><small>استمرارية واستعادة التفاعل الأسري</small></div></div>
  <div class="tabs"><button id="parentTab">الوالد</button><button id="childTab">الطفل</button></div>
</header>
<main id="app"></main>
<div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
(function(){
var TYPES={
 SHOW:{label:"أريد أن أريك شيئًا",icon:"👀",priority:72},
 TALK:{label:"أريد أن أتحدث معك",icon:"💬",priority:88},
 HELP:{label:"أحتاج مساعدتك",icon:"🤝",priority:96},
 SHARE:{label:"أريد أن أشاركك شيئًا",icon:"✨",priority:70}
};
var seed=[
{id:"m1",from:"محمد",type:"SHOW",status:"DEFERRED",created:Date.now()-17*60000,priority:72},
{id:"m2",from:"سارة",type:"TALK",status:"READY",created:Date.now()-8*60000,priority:88},
{id:"m3",from:"محمد",type:"HELP",status:"RECOVERED",created:Date.now()-55*60000,priority:96,recovered:Date.now()-35*60000}
];
var moments;
try{moments=JSON.parse(localStorage.getItem("radd-demo-v2"))||seed.map(function(x){return Object.assign({},x);});}catch(e){moments=seed.map(function(x){return Object.assign({},x);});}
var role="parent";
var app=document.getElementById("app"),overlay=document.getElementById("overlay"),toastEl=document.getElementById("toast");
function persist(){try{localStorage.setItem("radd-demo-v2",JSON.stringify(moments));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function ago(t){var m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"الآن":"منذ "+m+" دقيقة";}
function toast(msg){toastEl.textContent=msg;toastEl.classList.remove("hidden");setTimeout(function(){toastEl.classList.add("hidden");},2200);}
function setTabs(){document.getElementById("parentTab").className=role==="parent"?"active":"";document.getElementById("childTab").className=role==="child"?"active":"";}
function render(){
setTabs();
if(role==="parent") renderParent(); else renderChild();
}
function renderParent(){
var active=moments.filter(function(m){return m.status!=="RECOVERED";}).sort(function(a,b){return b.priority-a.priority;});
var rec=moments.filter(function(m){return m.status==="RECOVERED";});
var firr=moments.length?Math.round(rec.length/moments.length*100):0;
var lat=rec.length?Math.max(0,Math.round(rec.reduce(function(s,m){return s+(m.recovered-m.created)/60000;},0)/rec.length)):0;
app.innerHTML='<div class="wrap">'+
'<section class="hero"><div><div class="eyebrow">✦ فرصة ثانية للتواصل</div><h1>لا نحاول منع كل مقاطعة.<br><span>نحاول ألا تضيع اللحظة المهمة.</span></h1><p>رَدّ يحفظ فرصة التواصل عندما لا يستطيع أحد أفراد الأسرة الاستجابة في اللحظة نفسها، ثم يساعده على العودة إليها عندما يصبح الوقت مناسبًا.</p></div>'+
'<div class="hero-card"><div class="hero-icon">♥</div><b>لديك '+active.length+' فرص تواصل تحتاج عودتك</b><small>ابدأ بالأعلى أولوية</small></div></section>'+
'<section class="section"><div class="section-head"><div><h2>فرص التواصل المعلّقة</h2><p>اضغط على أي فرصة لترى تفاصيلها ثم أعد التفاعل.</p></div><button class="btn-ghost" id="resetBtn">إعادة التجربة</button></div>'+
'<div class="list">'+(active.length?active.map(momentCard).join(""):'<div class="empty">❤️ لا توجد فرص معلّقة الآن. جرّب إنشاء فرصة من وضع الطفل.</div>')+'</div></section>'+
'<section class="metrics"><div class="metric"><strong>'+firr+'%</strong><span>معدل استعادة التفاعل</span></div><div class="metric"><strong>'+lat+' د</strong><span>متوسط زمن العودة</span></div><div class="metric"><strong>'+rec.length+'</strong><span>تفاعلات تمت استعادتها</span></div></section>'+
'<section class="section"><div class="section-head"><div><h2>ما الذي حدث؟</h2><p>آخر نتائج الاستعادة في النموذج.</p></div></div><div class="timeline">'+(rec.length?rec.slice().reverse().map(function(m){return '<div class="event"><div class="eicon">♥</div><div><b>'+esc(m.from)+' — تمت استعادة التفاعل</b><small>'+ago(m.recovered)+' • استغرق '+Math.max(0,Math.round((m.recovered-m.created)/60000))+' دقيقة</small></div></div>';}).join(""):'<div class="empty">لم تتم استعادة أي تفاعل بعد.</div>')+'</div></section>'+
'<div class="privacy">🛡️ <span><b>الخصوصية جزء من التصميم.</b><br>لا ميكروفون دائم، لا كاميرا، لا مراقبة للشاشة ولا قراءة للمحادثات الخاصة.</span></div></div>';
document.getElementById("resetBtn").onclick=reset;
Array.prototype.forEach.call(document.querySelectorAll(".moment"),function(b){b.onclick=function(){openMoment(this.dataset.id);};});
}
function momentCard(m){
var t=TYPES[m.type],cls=m.status==="READY"?"status-ready":"status-deferred",st=m.status==="READY"?"جاهزة للعودة":"مؤجلة";
return '<button class="moment" data-id="'+esc(m.id)+'"><div class="micon">'+t.icon+'</div><div class="mbody"><div class="top"><b>'+esc(m.from)+'</b><small>'+ago(m.created)+'</small></div><p>'+t.label+'</p><span class="chip">أولوية '+m.priority+'</span><span class="chip '+cls+'">'+st+'</span></div><div class="chev">‹</div></button>';
}
function renderChild(){
var mine=moments.filter(function(m){return m.from==="محمد";}).sort(function(a,b){return b.created-a.created;});
app.innerHTML='<div class="wrap"><div class="child"><div class="child-head"><div class="avatar">م</div><div><div class="eyebrow">وضع الطفل</div><h1>عندك شيء تبي تقوله؟</h1><p class="lead">إذا بابا أو ماما مشغولين، احفظ فرصة التواصل حتى يرجعون لك.</p></div></div>'+
'<div class="save-panel"><button id="captureBtn"><div class="circle">♥</div><div><b>احفظها لي</b><small>أريد أن أقول شيئًا، أري شيئًا، أحتاج مساعدة، أو أشارك شيئًا</small></div><strong>←</strong></button></div>'+
'<div class="child-list"><div class="section-head"><div><h2>تفاعلاتي</h2><p>هنا ترى ماذا حدث لفرص التواصل التي حفظتها.</p></div></div>'+
(mine.length?mine.map(function(m){var t=TYPES[m.type];return '<div class="child-row '+(m.status==="RECOVERED"?"done":"")+'"><div class="dot"></div><div><b>'+t.icon+' '+t.label+'</b><small>'+(m.status==="RECOVERED"?"✓ تم التواصل":"بانتظار عودة الوالد")+" • "+ago(m.created)+'</small></div></div>';}).join(""):'<div class="empty">لم تحفظ أي فرصة بعد.</div>')+
'</div><div class="privacy">🛡️ <span>أنت تختار بنفسك ماذا تريد حفظه. لا نحتاج تسجيل صوتك أو تصويرك.</span></div></div></div>';
document.getElementById("captureBtn").onclick=capture;
}
function capture(){
overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeTypes">×</button><div class="eyebrow">فرصة تواصل جديدة</div><h2>ماذا تريد أن تحفظ؟</h2><p>اختر نوع التفاعل فقط، ثم اضغط تأكيد.</p><div class="type-grid">'+Object.keys(TYPES).map(function(k){var t=TYPES[k];return '<button data-type="'+k+'"><span>'+t.icon+'</span><b>'+t.label+'</b></button>';}).join("")+'</div></div></div>';
document.getElementById("closeTypes").onclick=closeModal;
Array.prototype.forEach.call(document.querySelectorAll("[data-type]"),function(b){b.onclick=function(){confirmType(this.dataset.type);};});
}
function confirmType(type){
var t=TYPES[type];
overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeConfirm">×</button><div class="eyebrow">تأكيد الحفظ</div><h2>تم اختيار فرصة التواصل</h2><div class="confirm"><strong>'+t.icon+' '+t.label+'</strong><small>ستظهر لدى الوالد ليتمكن من العودة إليها لاحقًا.</small></div><button class="action" id="saveMoment">حفظ فرصة التواصل</button><button class="secondary" id="backTypes">العودة</button></div></div>';
document.getElementById("closeConfirm").onclick=closeModal;document.getElementById("backTypes").onclick=capture;document.getElementById("saveMoment").onclick=function(){addMoment(type);};
}
function addMoment(type){
var t=TYPES[type];
moments.push({id:"m"+Date.now(),from:"محمد",type:type,status:"DEFERRED",created:Date.now(),priority:t.priority});
persist();closeModal();toast("❤️ تم حفظ فرصة التواصل");render();
}
function openMoment(id){
var m=moments.filter(function(x){return x.id===id;})[0];if(!m)return;
var t=TYPES[m.type],st=m.status==="READY"?"جاهزة للعودة":"مؤجلة";
overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeMoment">×</button><div class="eyebrow">فرصة تواصل '+st+'</div><h2>'+esc(m.from)+' — '+t.label+'</h2><p>هذه الفرصة لم تختفِ. رَدّ يحفظها حتى يتمكن الطرف المعني من العودة إليها.</p><div class="confirm"><strong>الأولوية: '+m.priority+'</strong><small>أضيفت '+ago(m.created)+'</small></div><button class="action" id="recoverBtn">♥ أعد التفاعل الآن</button><button class="secondary" id="laterBtn">ليس الآن</button></div></div>';
document.getElementById("closeMoment").onclick=closeModal;document.getElementById("laterBtn").onclick=closeModal;document.getElementById("recoverBtn").onclick=function(){recover(m.id);};
}
function recover(id){
var m=moments.filter(function(x){return x.id===id;})[0];if(!m)return;
var now=Date.now();
moments=moments.map(function(x){return x.id===id?Object.assign({},x,{status:"RECOVERED",recovered:now}):x;});
persist();
overlay.innerHTML='<div class="overlay"><div class="modal"><div class="eyebrow">تمت الاستعادة</div><h2>❤️ رجعت اللحظة</h2><p>تم تسجيل أن التفاعل عاد فعليًا.</p><div class="recovery"><b>'+esc(m.from)+' — '+TYPES[m.type].label+'</b><br>زمن العودة: '+Math.max(0,Math.round((now-m.created)/60000))+' دقيقة</div><button class="action" id="doneBtn">العودة إلى لوحة الوالد</button></div></div>';
document.getElementById("doneBtn").onclick=function(){closeModal();role="parent";render();toast("تم تسجيل استعادة التفاعل ❤️");};
}
function reset(){moments=seed.map(function(x){return Object.assign({},x);});persist();role="parent";render();toast("تمت إعادة تجربة RADD");}
function closeModal(){overlay.innerHTML="";}
document.getElementById("parentTab").onclick=function(){role="parent";render();};
document.getElementById("childTab").onclick=function(){role="child";render();};
render();
})();
</script>
</body>
</html>
