<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رَدّ | فرصة ثانية للتواصل</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
:root{--bg:#f7f7fb;--ink:#20223a;--muted:#777990;--line:#e7e6ef;--p:#6d5ef7;--soft:#f0efff;--green:#1e9a70}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 10% 0%,#ece9ff,transparent 33%),var(--bg);color:var(--ink)}button{font:inherit;border:0;cursor:pointer}
header{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1120px)/2));background:#ffffffdd;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;gap:11px;align-items:center}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#6d5ef7,#9c93ff);color:#fff;display:grid;place-items:center;font-size:21px}.brand b{font-size:20px}.brand small{display:block;color:#8c8d9c;font-size:9px}.switch{background:#f0eff7;border-radius:12px;padding:4px;display:flex;gap:3px}.switch button{padding:7px 13px;border-radius:9px;background:transparent;color:#777889;font-size:11px}.switch .on{background:#fff;color:var(--p);box-shadow:0 2px 8px #2222}
main{max-width:1120px;margin:auto;padding:46px 20px 80px}.hero{display:grid;grid-template-columns:1.45fr .75fr;gap:28px;align-items:center}.eyebrow{color:var(--p);font-size:11px;font-weight:800;margin-bottom:8px}.hero h1{font-size:42px;line-height:1.35;margin:0 0 13px}.hero h1 span{color:var(--p)}.hero p{font-size:14px;line-height:2;color:var(--muted);max-width:680px}.hero-card{background:linear-gradient(150deg,#fff,#f1efff);border:1px solid #e3defe;border-radius:26px;padding:28px;text-align:center;box-shadow:0 18px 45px #5143a512}.heart{width:62px;height:62px;margin:auto;border-radius:21px;background:#fff;display:grid;place-items:center;color:var(--p);font-size:28px}.hero-card b{display:block;margin-top:13px;font-size:16px}.hero-card small{color:var(--muted);font-size:10px}
.section{margin-top:48px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:4px 0 0;font-size:11px;color:var(--muted)}.ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:#66677b;font-size:11px}.list{display:grid;gap:10px}.item{width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;display:flex;align-items:center;gap:13px;text-align:right;transition:.18s;box-shadow:0 4px 18px #27233b05}.item:hover{transform:translateY(-2px);border-color:#d4cfff}.icon{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:0 0 52px}.body{flex:1}.topline{display:flex;justify-content:space-between}.topline b{font-size:14px}.topline small{font-size:10px;color:#999}.body p{margin:4px 0 7px;color:#56576b;font-size:12px}.tags span{font-size:9px;background:#f4f4f8;color:#707186;border-radius:18px;padding:4px 8px;margin-left:5px}.chev{color:#aaa;font-size:18px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.metric strong{display:block;font-size:24px}.metric span{font-size:10px;color:var(--muted)}.privacy{display:flex;gap:10px;align-items:flex-start;margin-top:16px;background:#eef9f5;border:1px solid #d4eee4;color:#17694e;border-radius:17px;padding:14px;font-size:11px;line-height:1.9}
.child{max-width:760px;margin:22px auto}.intro{display:flex;align-items:center;gap:16px}.avatar{width:65px;height:65px;border-radius:22px;background:linear-gradient(145deg,#6d5ef7,#9c93ff);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px}.intro h1{margin:0;font-size:29px}.intro p{margin:4px 0;color:var(--muted);font-size:12px}.capture{width:100%;margin-top:28px;background:#fff;border:1px solid #e2defd;border-radius:26px;padding:24px;display:flex;align-items:center;gap:15px;text-align:right;box-shadow:0 18px 42px #6d5ef712}.capture .heart{margin:0;box-shadow:none}.capture div:nth-child(2){flex:1}.capture b{display:block;font-size:18px}.capture span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.note{margin-top:13px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;font-size:11px;color:#68697b}
.overlay{position:fixed;inset:0;background:#1b193a75;backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(470px,100%);background:#fff;border-radius:24px;padding:27px;position:relative;box-shadow:0 30px 90px #17142f45}.close{position:absolute;left:14px;top:14px;background:#f5f5f8;color:#777;border-radius:9px;width:33px;height:33px}.modal h2{margin:0 0 6px;font-size:20px}.modal p{color:var(--muted);font-size:12px;line-height:1.9}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.choices button{background:#f7f7fa;border:1px solid var(--line);border-radius:15px;padding:13px;text-align:right}.choices button:hover{background:var(--soft);border-color:#cec8ff}.choices span{font-size:21px}.choices b{display:block;font-size:11px;margin-top:5px}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:17px 0}.detail div{background:#f7f7fa;border-radius:12px;padding:10px}.detail small{display:block;color:#999;font-size:8px}.detail b{display:block;margin-top:3px;font-size:11px}.primary,.secondary{width:100%;border-radius:12px;padding:12px;font-size:12px;font-weight:800}.primary{background:var(--p);color:#fff}.secondary{margin-top:7px;background:#f5f5f8;color:#66677a}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20223a;color:#fff;border-radius:12px;padding:11px 16px;font-size:11px;z-index:100}.hidden{display:none!important}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}.metrics{grid-template-columns:1fr}.section-head{align-items:flex-start;gap:10px;flex-direction:column}}@media(max-width:520px){.switch button{padding:6px 9px}.choices{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="mark">♥</div><div><b>رَدّ</b><small>استمرارية التفاعل الأسري</small></div></div>
<div class="switch"><button id="parentBtn" class="on">الوالد</button><button id="childBtn">الطفل</button></div>
</header>
<main id="app"></main><div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script>
var TYPES={SHOW:{label:"أريد أن أريك شيئًا",icon:"👀",priority:72},TALK:{label:"أريد أن أتحدث معك",icon:"💬",priority:88},HELP:{label:"أحتاج مساعدتك",icon:"🤝",priority:96},SHARE:{label:"أريد أن أشاركك شيئًا",icon:"✨",priority:70}};
var seed=[{id:"1",from:"محمد",type:"SHOW",status:"DEFERRED",at:Date.now()-17*60000,priority:72},{id:"2",from:"سارة",type:"TALK",status:"READY",at:Date.now()-8*60000,priority:88},{id:"3",from:"محمد",type:"HELP",status:"RECOVERED",at:Date.now()-55*60000,priority:96,recovered:Date.now()-35*60000}];
var moments=JSON.parse(localStorage.getItem("radd-demo")||"null")||seed;var role="parent";
function save(){localStorage.setItem("radd-demo",JSON.stringify(moments))}
function age(t){var m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"الآن":"منذ "+m+" دقيقة"}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.remove("hidden");setTimeout(function(){e.classList.add("hidden")},2300)}
function render(){document.getElementById("parentBtn").className=role==="parent"?"on":"";document.getElementById("childBtn").className=role==="child"?"on":"";document.getElementById("app").innerHTML=role==="parent"?parentView():childView()}
function parentView(){
 var active=moments.filter(function(m){return m.status!=="RECOVERED"}).sort(function(a,b){return b.priority-a.priority});
 var rec=moments.filter(function(m){return m.status==="RECOVERED"}),total=moments.length,firr=total?Math.round(rec.length/total*100):0,lat=rec.length?Math.round(rec.reduce(function(s,m){return s+(m.recovered-m.at)/60000},0)/rec.length):0;
 return '<section class="hero"><div><div class="eyebrow">✦ مساحة هادئة للعودة</div><h1>لا نحاول منع كل مقاطعة.<br><span>نحاول ألا تضيع اللحظة المهمة.</span></h1><p>رَدّ يحفظ فرصة التواصل عندما لا يستطيع أحد أفراد الأسرة الاستجابة في اللحظة نفسها، ثم يساعده على العودة إليها لاحقًا.</p></div><div class="hero-card"><div class="heart">♥</div><b>لديك '+active.length+' فرص تواصل تحتاج عودتك</b><small>ابدأ بالأعلى أولوية</small></div></section><section class="section"><div class="section-head"><div><h2>فرص التواصل المعلّقة</h2><p>مرتبة حسب الأولوية للمساعدة على العودة.</p></div><button class="ghost" onclick="resetDemo()">↻ إعادة التجربة</button></div><div class="list">'+(active.length?active.map(card).join(""):"<div class="privacy">❤️ <span>لا توجد فرص تواصل معلّقة الآن.</span></div>")+'</div></section><section class="metrics"><div class="metric"><strong>'+firr+'%</strong><span>معدل استعادة التفاعل</span></div><div class="metric"><strong>'+lat+' د</strong><span>متوسط زمن العودة</span></div><div class="metric"><strong>'+rec.length+'</strong><span>تفاعلات تمت استعادتها</span></div></section><div class="privacy">🛡️ <span><b>الخصوصية جزء من التصميم.</b><br>لا ميكروفون دائم، لا كاميرا، لا مراقبة للشاشة ولا قراءة للمحادثات.</span></div></section>'
}
function card(m){var t=TYPES[m.type];return '<button class="item" onclick="openMoment(\''+m.id+'\')"><div class="icon">'+t.icon+'</div><div class="body"><div class="topline"><b>'+m.from+'</b><small>'+age(m.at)+'</small></div><p>'+t.label+'</p><div class="tags"><span>أولوية '+m.priority+'</span><span>'+(m.status==="READY"?"جاهزة للعودة":"مؤجلة")+'</span></div></div><div class="chev">‹</div></button>'}
function childView(){var count=moments.filter(function(m){return m.status!=="RECOVERED"}).length;return '<div class="child"><div class="intro"><div class="avatar">م</div><div><div class="eyebrow">مساحتك</div><h1>عندك شيء تبي تقوله؟</h1><p>إذا بابا أو ماما مشغولين، احفظ فرصة التواصل حتى يرجعون لك.</p></div></div><button class="capture" onclick="capture()"><div class="heart">♥</div><div><b>احفظها لي</b><span>أتكلم · أوريك · أحتاج مساعدة · أشاركك شيئًا</span></div><strong>←</strong></button><div class="note">🛡️ أنت تختار بنفسك ماذا تريد حفظه. لا نحتاج تسجيل صوتك أو تصويرك.</div><div class="privacy"><span>فرص التواصل المعلّقة</span><b>'+count+'</b></div></div>'}
function capture(){document.getElementById("overlay").innerHTML='<div class="overlay"><div class="modal"><button class="close" onclick="closeModal()">×</button><div class="eyebrow">فرصة تواصل جديدة</div><h2>وش تبي تحفظ؟</h2><p>اختر نوع التفاعل فقط.</p><div class="choices">'+Object.keys(TYPES).map(function(k){var v=TYPES[k];return '<button onclick="addMoment(\''+k+'\')"><span>'+v.icon+'</span><b>'+v.label+'</b></button>'}).join("")+'</div></div></div>'}
function openMoment(id){var m=moments.find(function(x){return x.id===id}),t=TYPES[m.type];document.getElementById("overlay").innerHTML='<div class="overlay"><div class="modal"><button class="close" onclick="closeModal()">×</button><div class="icon">'+t.icon+'</div><div class="eyebrow">فرصة تواصل مؤجلة</div><h2>'+m.from+" "+t.label+'</h2><p>هذه الفرصة لم تختفِ. رَدّ يحتفظ بها حتى تختار العودة إليها.</p><div class="detail"><div><small>الأولوية</small><b>'+m.priority+'</b></div><div><small>المدة</small><b>'+age(m.at)+'</b></div><div><small>الحالة</small><b>'+(m.status==="READY"?"جاهزة":"مؤجلة")+'</b></div></div><button class="primary" onclick="recover(\''+id+'\')">♥ أعد التفاعل الآن</button><button class="secondary" onclick="closeModal()">ليس الآن</button></div></div>'}
function addMoment(type){var now=Date.now(),t=TYPES[type];moments.push({id:String(Date.now()),from:"محمد",type:type,status:"DEFERRED",at:now,priority:t.priority});save();closeModal();role="parent";render();toast("❤️ تم حفظ فرصة التواصل")}
function recover(id){var now=Date.now();moments=moments.map(function(m){return m.id===id?Object.assign({},m,{status:"RECOVERED",recovered:now}):m});save();closeModal();render();toast("تمت استعادة التفاعل ❤️")}
function closeModal(){document.getElementById("overlay").innerHTML=""}
function resetDemo(){moments=JSON.parse(JSON.stringify(seed));save();render();toast("تمت إعادة التجربة")}
document.getElementById("parentBtn").onclick=function(){role="parent";render()};document.getElementById("childBtn").onclick=function(){role="child";render()};render();
</script>
</body>
</html>
