<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b5cf7">
<title>رَدّ | فرصة ثانية للتواصل</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f6f7fb;--surface:#fff;--ink:#1f2338;--muted:#74798c;--line:#e5e6ef;
  --primary:#6b5cf6;--primary-dark:#5647df;--soft:#efedff;--purple:#8d82ff;
  --good:#16835f;--good-bg:#ecf9f3;--warn:#c77f22;--warn-bg:#fff6e6;
  --danger:#c95c55;--shadow:0 18px 45px rgba(39,29,95,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(circle at 100% 0,#edeaff 0,transparent 32%),var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #8d82ff55;outline-offset:3px}
.header{height:76px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--primary),var(--purple));color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px #6b5cf633}
.brand-name{font-size:20px;font-weight:800}.brand-sub{font-size:9px;color:#9295a4;margin-top:-2px}
.tabs{display:flex;gap:4px;background:#eff0f6;padding:4px;border-radius:13px}.tab{border:0;background:transparent;color:#7a7d8f;border-radius:10px;padding:8px 15px;font-size:11px}.tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 10px #24213710}
.container{max-width:1120px;margin:auto;padding:36px 20px 80px}
.demo-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end}.demo-head h1{margin:0;font-size:28px}.demo-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.demo-reset{border:1px solid var(--line);background:#fff;color:#64687b;border-radius:10px;padding:8px 12px;font-size:10px}
.guide{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow)}
.guide-title{font-size:13px;font-weight:800}.guide-steps{display:flex;align-items:center;gap:8px;margin-top:12px;overflow:auto;padding-bottom:2px}.guide-step{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:10px;color:#777b8e}.num{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:#f0efff;color:var(--primary);font-weight:800}.connector{height:1px;min-width:18px;background:#ddddeb}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:stretch;margin-top:26px}.hero-copy,.hero-card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero-copy{padding:28px}.eyebrow{font-size:11px;color:var(--primary);font-weight:800}.hero-copy h2{font-size:36px;line-height:1.4;margin:8px 0}.hero-copy h2 span{color:var(--primary)}.hero-copy p{font-size:13px;line-height:2;color:var(--muted);margin:0;max-width:690px}.quote{margin-top:18px;background:var(--soft);border-radius:17px;padding:13px 16px;font-size:12px;color:#454861}.hero-card{padding:26px;background:linear-gradient(155deg,#fff,#f3f1ff);display:flex;flex-direction:column;justify-content:center;text-align:center}.hero-badge{width:70px;height:70px;border-radius:22px;background:#fff;color:var(--primary);display:grid;place-items:center;font-size:31px;margin:0 auto 12px;box-shadow:0 10px 30px #6b5cf61c}.hero-card strong{font-size:17px}.hero-card small{color:var(--muted);font-size:10px;margin-top:4px}
.panel{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}.panel-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}.panel-head h3{margin:0;font-size:18px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:10px}
.moment{width:100%;background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;display:flex;align-items:center;gap:12px;text-align:right;transition:.15s}.moment:hover{transform:translateY(-2px);border-color:#d4d0fb;box-shadow:0 10px 26px #39306a08}.micon{width:52px;height:52px;flex:0 0 52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:22px}.mbody{flex:1}.m-top{display:flex;justify-content:space-between;gap:8px}.m-top b{font-size:13px}.m-top small{font-size:9px;color:#9c9eac}.mbody p{font-size:11px;color:#55596c;margin:4px 0 7px}.chip{display:inline-block;font-size:8px;padding:4px 8px;border-radius:20px;background:#f4f4f8;color:#6e7182;margin-left:4px}.ready{background:var(--warn-bg);color:var(--warn)}.deferred{background:#f1efff;color:var(--primary)}.recovered{background:var(--good-bg);color:var(--good)}.chev{font-size:21px;color:#a2a4b1}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.metric strong{display:block;font-size:26px}.metric span{font-size:9px;color:var(--muted)}
.privacy{margin-top:13px;background:var(--good-bg);border:1px solid #d5eee4;color:#17694e;border-radius:16px;padding:12px 14px;font-size:10px;line-height:1.9}
.child-wrap{max-width:790px;margin:0 auto}.child-card{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:26px}.child-intro{display:flex;align-items:center;gap:14px}.avatar{width:64px;height:64px;border-radius:21px;background:linear-gradient(145deg,var(--primary),var(--purple));display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}.child-intro h2{font-size:28px;margin:0}.child-intro p{font-size:11px;color:var(--muted);margin:4px 0 0;line-height:1.8}
.try-box{margin-top:25px;border-radius:20px;background:linear-gradient(145deg,#f7f5ff,#efedff);border:1px solid #e1ddff;padding:20px}.try-box .scenario{font-size:11px;color:#5d6175}.speech{margin-top:12px;background:#fff;border-radius:17px;padding:14px;font-size:15px;font-weight:700;box-shadow:0 8px 25px #5d53b90b}.speech span{display:block;color:var(--muted);font-size:9px;margin-top:5px;font-weight:400}
.big-action{width:100%;margin-top:15px;border:0;background:linear-gradient(145deg,var(--primary),var(--primary-dark));color:#fff;border-radius:15px;padding:15px 17px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.big-action span{opacity:.8;font-size:17px}
.success-card{margin-top:16px;background:var(--good-bg);border:1px solid #d3eee2;border-radius:18px;padding:17px}.success-card h3{margin:0;font-size:15px;color:#176a50}.success-card p{margin:5px 0 0;color:#4b665d;font-size:10px;line-height:1.8}.next-btn{margin-top:12px;border:0;background:#fff;color:var(--good);border-radius:10px;padding:9px 12px;font-size:10px;font-weight:800}
.children-history{margin-top:18px}.history-row{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:0 0 10px}.history-row.done .dot{background:var(--good)}.history-row b{font-size:11px}.history-row small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.overlay{position:fixed;inset:0;background:#1a173868;backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(510px,100%);background:#fff;border-radius:24px;padding:26px;position:relative;box-shadow:0 30px 90px #17132d44}.close{position:absolute;left:13px;top:13px;width:31px;height:31px;border:0;border-radius:9px;background:#f4f4f7;color:#777}.modal .icon-big{width:58px;height:58px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:24px}.modal h2{font-size:20px;margin:12px 0 5px}.modal p{font-size:11px;color:var(--muted);line-height:1.9}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.detail{background:#f7f7f9;border-radius:12px;padding:10px}.detail small{font-size:8px;color:#9395a3}.detail b{display:block;font-size:11px;margin-top:2px}.action-primary{width:100%;border:0;background:var(--primary);color:#fff;border-radius:12px;padding:12px;font-size:12px;font-weight:800}.action-secondary{width:100%;margin-top:7px;border:0;background:#f3f3f6;color:#66697a;border-radius:12px;padding:11px;font-size:11px}.recovered-modal{background:var(--good-bg);border:1px solid #d5eee3;border-radius:17px;padding:14px;margin:13px 0;font-size:10px;color:#17694e;line-height:1.9}
.toast{position:fixed;bottom:21px;left:50%;transform:translateX(-50%);background:#202239;color:#fff;border-radius:12px;padding:10px 15px;font-size:10px;z-index:90;box-shadow:0 10px 30px #15132655}.hidden{display:none!important}
@media(max-width:850px){.hero{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.demo-head{align-items:flex-start;flex-direction:column}.container{padding:28px 14px 70px}}
@media(max-width:540px){.header{padding:0 12px}.brand-sub{display:none}.tab{padding:7px 9px}.hero-copy h2{font-size:31px}.child-intro h2{font-size:24px}.detail-grid{grid-template-columns:1fr 1fr}.guide-steps{gap:7px}}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="brand-mark">♥</div>
    <div><div class="brand-name">رَدّ</div><div class="brand-sub">نظام لاستعادة فرص التواصل الأسري</div></div>
  </div>
  <div class="tabs">
    <button id="parentTab" class="tab active">الوالد</button>
    <button id="childTab" class="tab">الطفل</button>
  </div>
</header>

<main id="app"></main>
<div id="overlay"></div>
<div id="toast" class="toast hidden"></div>

<script>
(function(){
  var TYPES={
    SHOW:{label:"أريد أن أريك شيئًا",icon:"👀",priority:72},
    TALK:{label:"أريد أن أتحدث معك",icon:"💬",priority:88},
    HELP:{label:"أحتاج مساعدتك",icon:"🤝",priority:96},
    SHARE:{label:"أريد أن أشاركك شيئًا",icon:"✨",priority:70}
  };

  var seed=[
    {id:"m1",from:"محمد",type:"SHOW",status:"DEFERRED",created:Date.now()-9*60000,priority:72},
    {id:"m2",from:"سارة",type:"TALK",status:"READY",created:Date.now()-4*60000,priority:88},
    {id:"m3",from:"محمد",type:"HELP",status:"RECOVERED",created:Date.now()-55*60000,priority:96,recovered:Date.now()-35*60000}
  ];

  var moments;
  try {
    moments=JSON.parse(localStorage.getItem("radd-demo-v3"))||seed.map(function(x){return Object.assign({},x);});
  } catch(e) {
    moments=seed.map(function(x){return Object.assign({},x);});
  }

  var role="parent";
  var app=document.getElementById("app");
  var overlay=document.getElementById("overlay");
  var toastEl=document.getElementById("toast");

  function persist(){try{localStorage.setItem("radd-demo-v3",JSON.stringify(moments));}catch(e){}}
  function ago(t){var m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"الآن":"منذ "+m+" دقيقة";}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function toast(msg){toastEl.textContent=msg;toastEl.classList.remove("hidden");setTimeout(function(){toastEl.classList.add("hidden");},2200);}
  function setTabs(){document.getElementById("parentTab").className="tab "+(role==="parent"?"active":"");document.getElementById("childTab").className="tab "+(role==="child"?"active":"");}
  function render(){
    setTabs();
    if(role==="child"){renderChild();}else{renderParent();}
  }

  function guide(){
    return '<div class="guide"><div class="guide-title">جرّب الفكرة في أقل من دقيقة</div><div class="guide-steps">'+
      '<div class="guide-step"><span class="num">١</span><span>محاولة تواصل</span></div><div class="connector"></div>'+
      '<div class="guide-step"><span class="num">٢</span><span>تعذر الرد</span></div><div class="connector"></div>'+
      '<div class="guide-step"><span class="num">٣</span><span>حفظ الفرصة</span></div><div class="connector"></div>'+
      '<div class="guide-step"><span class="num">٤</span><span>العودة</span></div><div class="connector"></div>'+
      '<div class="guide-step"><span class="num">٥</span><span>استعادة التفاعل</span></div>'+
      '</div></div>';
  }

  function renderParent(){
    var active=moments.filter(function(m){return m.status!=="RECOVERED";}).sort(function(a,b){return b.priority-a.priority;});
    var rec=moments.filter(function(m){return m.status==="RECOVERED";});
    var firr=moments.length?Math.round(rec.length/moments.length*100):0;
    var lat=rec.length?Math.max(0,Math.round(rec.reduce(function(s,m){return s+(m.recovered-m.created)/60000;},0)/rec.length)):0;

    app.innerHTML='<div class="container">'+
      '<div class="demo-head"><div><div class="eyebrow">التجربة الحية</div><h1>لوحة الوالد</h1><p>هنا تظهر فرص التواصل التي تحتاج عودتك إليها.</p></div><button id="resetDemo" class="demo-reset">↻ إعادة السيناريو</button></div>'+
      guide()+
      '<section class="hero"><div class="hero-copy"><div class="eyebrow">الفكرة الأساسية</div><h2>لا نمنع كل مقاطعة.<br><span>نمنع ضياع التفاعل المهم.</span></h2><p>عندما لا تستطيع الاستجابة الآن، يحفظ رَدّ فرصة التواصل ويساعدك على العودة إليها في الوقت المناسب.</p><div class="quote">مثال: <b>«بابا.. شوف!»</b> ← «بعد شوي يا حبيبي» ← رَدّ يحفظ فرصة التواصل حتى تعود إليها.</div></div><div class="hero-card"><div class="hero-badge">♥</div><strong>لديك '+active.length+' فرص تواصل معلّقة</strong><small>ابدأ بالفرصة الأعلى أولوية</small></div></section>'+
      '<section class="panel"><div class="panel-head"><div><h3>فرص التواصل</h3><p>اضغط على أي فرصة لمعرفة ما يحتاجه الطرف الآخر.</p></div></div><div class="list">'+(active.length?active.map(momentCard).join(""):'<div class="empty">لا توجد فرص معلّقة الآن. انتقل إلى «الطفل» لإنشاء تجربة جديدة.</div>')+'</div></section>'+
      '<section class="metrics"><div class="metric"><strong>'+firr+'%</strong><span>معدل استعادة التفاعل</span></div><div class="metric"><strong>'+lat+' د</strong><span>متوسط زمن العودة</span></div><div class="metric"><strong>'+rec.length+'</strong><span>تفاعلات تمت استعادتها</span></div></section>'+
      '<div class="privacy">🛡️ <b>خصوصية أولًا:</b>&nbsp; لا ميكروفون دائم، لا كاميرا، لا مراقبة للشاشة، ولا قراءة للمحادثات الخاصة.</div></div>';

    document.getElementById("resetDemo").onclick=reset;
    Array.prototype.forEach.call(document.querySelectorAll(".moment"),function(b){b.onclick=function(){openMoment(b.getAttribute("data-id"));};});
  }

  function momentCard(m){
    var t=TYPES[m.type];
    var st=m.status==="READY"?"جاهزة للعودة":"مؤجلة";
    var cls=m.status==="READY"?"ready":"deferred";
    return '<button class="moment" data-id="'+esc(m.id)+'"><div class="micon">'+t.icon+'</div><div class="mbody"><div class="m-top"><b>'+esc(m.from)+'</b><small>'+ago(m.created)+'</small></div><p>'+t.label+'</p><span class="chip">أولوية '+m.priority+'</span><span class="chip '+cls+'">'+st+'</span></div><div class="chev">‹</div></button>';
  }

  function renderChild(){
    var mine=moments.filter(function(m){return m.from==="محمد";}).sort(function(a,b){return b.created-a.created;});
    var last=mine[0];
    var success=last&&last._justCreated;
    if(success){last._justCreated=false;}

    app.innerHTML='<div class="container"><div class="child-wrap">'+
      '<div class="demo-head"><div><div class="eyebrow">التجربة الحية</div><h1>تجربة الطفل</h1><p>ابدأ من هنا، ثم انتقل إلى شاشة الوالد لترى كيف تعود فرصة التواصل.</p></div></div>'+
      guide()+
      '<div class="child-card"><div class="child-intro"><div class="avatar">م</div><div><div class="eyebrow">محمد</div><h2>عندي شيء أبي أقوله</h2><p>إذا بابا أو ماما مشغولين، لا تختفي فرصتي في التواصل.</p></div></div>'+
      '<div class="try-box"><div class="scenario">الموقف التجريبي</div><div class="speech">«بابا.. شوف رسمتي!»<span>الأب مشغول ولا يستطيع الرد في هذه اللحظة.</span></div><button id="saveChance" class="big-action"><span>احفظ فرصة التواصل</span><span>←</span></button>'+
      (success?'<div class="success-card"><h3>✓ تم حفظ فرصة التواصل</h3><p>تم إرسال الفرصة إلى لوحة الوالد. الآن انتقل إلى شاشة «الوالد» لتجرب استعادة التفاعل.</p><button id="goParent" class="next-btn">عرض تجربة الوالد ←</button></div>':'')+
      '</div>'+
      '<div class="children-history"><div class="panel-head"><div><h3>ماذا حدث لفرصي؟</h3><p>كل محاولة تمر من الحفظ إلى الاستعادة.</p></div></div>'+
      (mine.length?mine.map(historyRow).join(""):'<div class="empty">لم تحفظ أي فرصة بعد.</div>')+
      '</div>'+
      '<div class="privacy">🛡️ أنت تختار بنفسك ماذا تحفظ. لا نحتاج تسجيل صوتك أو تصويرك.</div></div></div></div>';

    document.getElementById("saveChance").onclick=function(){capture();};
    if(success){document.getElementById("goParent").onclick=function(){role="parent";render();};}
  }

  function historyRow(m){
    var t=TYPES[m.type],done=m.status==="RECOVERED";
    return '<div class="history-row '+(done?"done":"")+'"><div class="dot"></div><div><b>'+t.icon+' '+t.label+'</b><small>'+(done?"✓ تم استعادة التفاعل":"بانتظار عودة الوالد")+' • '+ago(m.created)+'</small></div></div>';
  }

  function capture(){
    overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeTypes">×</button><div class="eyebrow">حفظ فرصة تواصل</div><h2>ماذا تريد أن تقول؟</h2><p>اختر نوع التفاعل فقط. الهدف ليس تسجيل المحتوى، بل حفظ فرصة العودة إليه.</p><div class="type-grid">'+Object.keys(TYPES).map(function(k){var t=TYPES[k];return '<button data-type="'+k+'"><span>'+t.icon+'</span><b>'+t.label+'</b></button>';}).join("")+'</div></div></div>';
    var style=document.createElement("style");
    style.textContent=".type-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.type-grid button{background:#f8f8fb;border:1px solid var(--line);border-radius:15px;padding:13px;text-align:right}.type-grid button:hover{background:var(--soft);border-color:#cfc9ff}.type-grid span{font-size:21px}.type-grid b{display:block;font-size:11px;margin-top:5px}";
    document.head.appendChild(style);
    document.getElementById("closeTypes").onclick=closeModal;
    Array.prototype.forEach.call(document.querySelectorAll("[data-type]"),function(b){b.onclick=function(){confirmType(b.getAttribute("data-type"));};});
  }

  function confirmType(type){
    var t=TYPES[type];
    overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeConfirm">×</button><div class="eyebrow">الخطوة التالية</div><h2>جاهزة للحفظ</h2><p>سيظهر هذا التفاعل عند الوالد ليتمكن من العودة إليه.</p><div class="confirm"><strong>'+t.icon+' '+t.label+'</strong><small>لن يتم تسجيل الصوت أو الصورة.</small></div><button class="action-primary" id="saveMoment">حفظ فرصة التواصل</button><button class="action-secondary" id="backTypes">رجوع</button></div></div>';
    var style=document.createElement("style");
    style.textContent=".confirm{background:#f7f7fa;border-radius:16px;padding:14px;margin:13px 0}.confirm strong{display:block;font-size:14px}.confirm small{display:block;font-size:9px;color:var(--muted);margin-top:4px}";
    document.head.appendChild(style);
    document.getElementById("closeConfirm").onclick=closeModal;
    document.getElementById("backTypes").onclick=capture;
    document.getElementById("saveMoment").onclick=function(){addMoment(type);};
  }

  function addMoment(type){
    var t=TYPES[type];
    moments=moments.filter(function(m){return !m._justCreated;});
    moments.push({id:"m"+Date.now(),from:"محمد",type:type,status:"DEFERRED",created:Date.now(),priority:t.priority,_justCreated:true});
    persist();
    closeModal();
    role="child";
    render();
    toast("❤️ تم حفظ فرصة التواصل لدى الوالد");
  }

  function openMoment(id){
    var m=moments.filter(function(x){return x.id===id;})[0];if(!m)return;
    var t=TYPES[m.type];
    overlay.innerHTML='<div class="overlay"><div class="modal"><button class="close" id="closeMoment">×</button><div class="icon-big">'+t.icon+'</div><div class="eyebrow" style="margin-top:12px">فرصة تواصل '+(m.status==="READY"?"جاهزة":"مؤجلة")+'</div><h2>'+esc(m.from)+' — '+t.label+'</h2><p>لم تختفِ هذه الفرصة. رَدّ يحتفظ بها حتى يتمكن الطرف المعني من العودة إليها.</p><div class="detail-grid"><div class="detail"><small>الأولوية</small><b>'+m.priority+'</b></div><div class="detail"><small>أضيفت</small><b>'+ago(m.created)+'</b></div><div class="detail"><small>الحالة</small><b>'+ (m.status==="READY"?"جاهزة":"مؤجلة") +'</b></div></div><button class="action-primary" id="recoverBtn">♥ أعد التفاعل الآن</button><button class="action-secondary" id="laterBtn">ليس الآن</button></div></div>';
    document.getElementById("closeMoment").onclick=closeModal;
    document.getElementById("laterBtn").onclick=closeModal;
    document.getElementById("recoverBtn").onclick=function(){recover(id);};
  }

  function recover(id){
    var m=moments.filter(function(x){return x.id===id;})[0];if(!m)return;
    var now=Date.now();
    moments=moments.map(function(x){return x.id===id?Object.assign({},x,{status:"RECOVERED",recovered:now,_justCreated:false}):x;});
    persist();
    overlay.innerHTML='<div class="overlay"><div class="modal"><div class="eyebrow">اكتملت الدورة</div><h2>❤️ تمت استعادة التفاعل</h2><p>الآن لم تعد فرصة التواصل مجرد تذكير؛ لقد عادت إلى تفاعل فعلي.</p><div class="recovered-modal"><b>'+esc(m.from)+' — '+TYPES[m.type].label+'</b><br>زمن العودة: '+Math.max(0,Math.round((now-m.created)/60000))+' دقيقة<br>الحالة: <b>تمت الاستعادة</b></div><button class="action-primary" id="doneBtn">العودة إلى لوحة الوالد</button></div></div>';
    document.getElementById("doneBtn").onclick=function(){closeModal();role="parent";render();toast("تم تسجيل استعادة التفاعل ❤️");};
  }

  function closeModal(){overlay.innerHTML="";}
  function reset(){moments=seed.map(function(x){return Object.assign({},x,_justCreated?{_justCreated:false}:{});});persist();role="parent";render();toast("تمت إعادة السيناريو");}
  document.getElementById("parentTab").onclick=function(){role="parent";render();};
  document.getElementById("childTab").onclick=function(){role="child";render();};
  render();
})();
</script>
</body>
</html>
