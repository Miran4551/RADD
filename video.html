<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RADD | رَدّ — فيديو العرض</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#08090f;color:#fff;font-family:Cairo,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
.wrap{width:min(1100px,100%);text-align:center}
.card{background:#11131c;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
h1{margin:0 0 4px;font-size:28px}
p{margin:0 0 18px;color:#aeb6c8;font-size:13px}
video{display:block;width:100%;max-height:76vh;background:#000;border-radius:16px}
.note{margin-top:14px;font-size:11px;color:#8f98aa}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <h1>RADD | رَدّ</h1>
    <p>نظام لاستعادة فرص التواصل الأسري — فيديو العرض</p>
    <video controls playsinline preload="metadata">
      <source src="./RADD.mp4" type="video/mp4">
      متصفحك لا يدعم تشغيل الفيديو.
    </video>
    <div class="note">فيديو العرض الرسمي للمشروع</div>
  </div>
</main>
</body>
</html>
